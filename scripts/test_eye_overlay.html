<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #111010;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .portrait-wrap {
      position: relative;
      width: 448px;
      height: 600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    .portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .eye-overlay-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="portrait-wrap">
    <img src="../public/assets/images/monisha_character.jpg" class="portrait-img">
    
    <svg class="eye-overlay-svg" viewBox="0 0 896 1200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Perfect Right eye socket clip path -->
        <clipPath id="rightEyeClip">
          <path d="M 466,417 C 480,410 505,406 536,414 C 541,416 545,419 542,422 C 536,436 518,444 494,440 C 480,436 470,425 466,417 Z" />
        </clipPath>

        <!-- Sclera gradient -->
        <linearGradient id="scleraGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3d1f1a" />
          <stop offset="25%" stop-color="#7a463c" />
          <stop offset="65%" stop-color="#c99185" />
          <stop offset="100%" stop-color="#d49e92" />
        </linearGradient>

        <!-- Iris gradient matching original artwork -->
        <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0a0505" />
          <stop offset="55%" stop-color="#1f0f0d" />
          <stop offset="85%" stop-color="#4a1e18" />
          <stop offset="100%" stop-color="#6e2d24" />
        </linearGradient>

        <!-- Left eye socket clip path -->
        <clipPath id="leftEyeClip">
          <path d="M 572,429 C 576,424 584,421 594,425 C 596,428 594,433 590,436 C 583,438 576,435 572,429 Z" />
        </clipPath>
      </defs>

      <!-- RIGHT EYE (Viewer Left) -->
      <!-- 1. Eye socket sclera base -->
      <path d="M 466,417 C 480,410 505,406 536,414 C 541,416 545,419 542,422 C 536,436 518,444 494,440 C 480,436 470,425 466,417 Z"
            fill="url(#scleraGrad)" />

      <!-- 2. Movable Pupil/Iris Group (Clipped inside eye socket) -->
      <g clip-path="url(#rightEyeClip)">
        <g id="rightPupilGroup" style="transform: translate(0px, 0px);">
          <!-- Iris body -->
          <ellipse cx="523.5" cy="431" rx="11.5" ry="14" fill="url(#irisGrad)" />
          <!-- Pupil dark core -->
          <ellipse cx="524" cy="430.5" rx="6" ry="8" fill="#070303" />
          <!-- Specular catchlight -->
          <circle cx="519" cy="425.5" r="3" fill="#ffffff" />
          <!-- Secondary warm glint -->
          <circle cx="528" cy="434" r="1.6" fill="rgba(255, 235, 220, 0.8)" />
          <!-- Bottom iris ambient glow -->
          <ellipse cx="523.5" cy="440" rx="7" ry="3.5" fill="rgba(255, 67, 46, 0.45)" />
        </g>
      </g>

      <!-- 3. Eyeliner & Lashes on top of pupil -->
      <path d="M 462,419 C 476,410 505,404 538,413 C 543,415 547,418 544,421 C 538,418 505,407 472,416 Z"
            fill="#080303" />
      <!-- Upper lash spikes -->
      <path d="M 486,410 L 483,404 L 489,409 Z M 510,405 L 512,399 L 515,406 Z M 532,411 L 538,406 L 535,413 Z"
            fill="#080303" />
      <!-- Lower lid line -->
      <path d="M 470,421 C 488,435 514,441 540,424"
            fill="none" stroke="rgba(25, 12, 12, 0.8)" stroke-width="1.4" />

      <!-- LEFT EYE (Viewer Right) -->
      <path d="M 572,429 C 576,424 584,421 594,425 C 596,428 594,433 590,436 C 583,438 576,435 572,429 Z"
            fill="url(#scleraGrad)" />
      <g clip-path="url(#leftEyeClip)">
        <g id="leftPupilGroup" style="transform: translate(0px, 0px);">
          <ellipse cx="583" cy="430" rx="6.5" ry="8" fill="url(#irisGrad)" />
          <ellipse cx="583" cy="430" rx="3.5" ry="4.5" fill="#070303" />
          <circle cx="580.5" cy="427" r="1.8" fill="#ffffff" />
        </g>
      </g>
      <path d="M 570,429 C 575,424 584,421 595,426 C 596,428 594,430 591,428 C 583,424 575,426 571,430 Z"
            fill="#080303" />
    </svg>
  </div>
</body>
</html>
